name: Sync Fork

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: main    # 在 job 级别定义，所有 steps 可用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure upstream remote and fetch
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git
          git fetch upstream --prune

      - name: Merge upstream into default branch
        run: |
          git checkout $DEFAULT_BRANCH
          git merge --no-edit upstream/$DEFAULT_BRANCH || true

      - name: Push changes to origin
        run: |
          git push origin HEAD:$DEFAULT_BRANCH
